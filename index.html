<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TO DO LIST</title>
</head>

<body style="background-color: rgb(202, 202, 202);">
  <h1 style="font-family: 'Franklin Gothic Medium'">TO DO LIST</h1>
  <input style="border: none;" type="text" id="input-js" placeholder="Enter task">
  <button
    style="background-color: rgb(133, 234, 133); height: 19px; width: 59px; border: 1px solid rgb(0, 0, 0); font-family: 'Franklin Gothic Medium'"
    id="js-add-button">ADD
  </button>
  <div style="font-family: 'Franklin Gothic Medium';
              font-weight: bold;
              " id="js-display-tasks">
    <br>
  </div>
</body>

<script>

  element_add_btn = document.querySelector("#js-add-button");
  element_input_task = document.querySelector("#input-js");

  // algorith
  // > get input
  // > put input into array
  // > display array

  let tasks = [];
  let html_list = '';

  function task_add() {
    const list = element_input_task.value;
    tasks.push(list);
    console.log(tasks);
  }

  function task_display() {

    for (let i = 0; i < tasks.length; i++) {
      const list = tasks[i];
      const html =
        `<p>
          ${list} 
          <button style="background-color: red; border: 1px solid black; font-weight: bold;" onclick = "
            tasks.splice(${i}, 1)
            ;
          ;">DELETE</button>
        </p>`;
      html_list = html;
    }

  }



  element_add_btn.onclick = function () {
    task_add();
    task_display();
    document.querySelector("#js-display-tasks")
      .innerHTML += html_list;
  }

</script>

</html>
